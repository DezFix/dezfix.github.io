<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hanten — документация</title>
<link rel="icon" type="image/png" href="/icon.png">
<script src="/i18n.js"></script>
<style>
:root { color-scheme: dark; --bg: #141824; --card: #20263c; --accent: #e0685c; --text: #f0ebf5; --muted: #a7aec7; }
* { box-sizing: border-box; }
body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
.wrap { max-width: 720px; margin: 0 auto; padding: 32px 20px 64px; animation: rise .5s ease both; }
@keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
a { color: var(--accent); }
.head { display: flex; align-items: center; gap: 12px; }
.head img { width: 44px; height: 44px; border-radius: 12px; }
.head b { letter-spacing: 3px; }
.head .sp { flex: 1; }
h1 { font-size: 30px; margin: 18px 0 0; }
h2 { font-size: 20px; margin-top: 36px; }
h2::before { content: "✦ "; color: var(--accent); }
p, li { line-height: 1.65; }
.muted { color: var(--muted); }
.card { background: var(--card); border: 1px solid #2c3452; border-radius: 14px; padding: 14px 18px; margin: 12px 0; transition: border-color .2s ease; }
.card:hover { border-color: var(--accent); }
.back { display: inline-block; margin: 6px 0 12px; text-decoration: none; }
.lang { display: inline-flex; border: 1px solid #4a5478; border-radius: 999px; overflow: hidden; }
.lang-btn { background: transparent; border: 0; color: var(--muted); font-size: 12px; padding: 5px 10px; cursor: pointer; }
.lang-btn.active { background: var(--accent); color: #221016; font-weight: 700; }
@media (prefers-reduced-motion: reduce) { .wrap { animation: none; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <img src="/icon.png" alt="Hanten">
    <b>HANTEN</b>
    <span class="sp"></span>
    <span class="lang">
      <button class="lang-btn" data-lang="ru" onclick="HantenI18n.set('ru')">RU</button>
      <button class="lang-btn" data-lang="en" onclick="HantenI18n.set('en')">EN</button>
    </span>
  </div>
  <a class="back" href="/" data-i18n="d.back">← На главную</a>
  <h1 data-i18n="d.title">Документация</h1>

  <h2 data-i18n="d.install">Установка</h2>
  <div class="card"><p><span data-i18n="d.install.t"></span> <a href="https://github.com/DezFix/Hanten/releases/latest">APK</a>.</p></div>

  <h2 data-i18n="d.sources">Источники</h2>
  <p data-i18n="d.sources.t"></p>

  <h2 data-i18n="d.similar">Похожая манга</h2>
  <p data-i18n="d.similar.t"></p>

  <h2 data-i18n="d.share">Как поделиться мангой</h2>
  <p data-i18n="d.share.t"></p>

  <h2 data-i18n="d.privacy">Приватность</h2>
  <p data-i18n="d.privacy.t"></p>

  <h2 data-i18n="d.rights">Права и лицензии</h2>
  <p><span data-i18n="d.rights.t"></span> <a href="https://github.com/DezFix/Hanten/blob/devel/LICENSE">GPL-3.0</a>.</p>

  <h2 data-i18n="d.faq">Частые вопросы</h2>
  <div class="card"><p><b data-i18n="d.q1"></b><br><span class="muted" data-i18n="d.a1"></span></p></div>
  <div class="card"><p><b data-i18n="d.q2"></b><br><span class="muted" data-i18n="d.a2"></span></p></div>
  <div class="card"><p><b data-i18n="d.q3"></b><br><span class="muted" data-i18n="d.a3"></span></p></div>
</div>
</body>
</html>
