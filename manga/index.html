<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hanten — открыть мангу</title>
<link rel="icon" type="image/png" href="/icon.png">
<script src="/i18n.js"></script>
<style>
:root { color-scheme: dark; --bg: #141824; --card: #20263c; --accent: #e0685c; --text: #f0ebf5; --muted: #a7aec7; }
* { box-sizing: border-box; }
body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
body::before { content: ""; position: fixed; inset: 0; pointer-events: none;
  background: radial-gradient(600px 400px at 50% -5%, rgba(224,104,92,.16), transparent 60%); }
.wrap { max-width: 560px; margin: 0 auto; padding: 56px 20px; text-align: center; position: relative;
  animation: rise .5s ease both; }
@keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
.icon { width: 84px; height: 84px; border-radius: 22px; box-shadow: 0 12px 34px rgba(224,104,92,.35);
  animation: float 5s ease-in-out infinite; }
.cover { max-width: 240px; width: 100%; border-radius: 16px; box-shadow: 0 14px 40px rgba(0,0,0,.5); margin-bottom: 6px; }
@keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
h1 { font-size: 22px; margin: 18px 0 6px; }
.sub { color: var(--muted); font-size: 14px; margin: 0 0 26px; }
.btn { display: block; padding: 15px; border-radius: 14px; text-decoration: none; font-weight: 700; margin: 10px 0;
  transition: transform .18s ease, box-shadow .18s ease; }
.btn:hover { transform: translateY(-2px); }
.primary { background: var(--accent); color: #221016; }
.primary:hover { box-shadow: 0 10px 28px rgba(224,104,92,.45); }
.secondary { background: var(--card); color: var(--text); border: 1px solid #2c3452; font-weight: 400; }
.secondary:hover { border-color: var(--accent); }
.note { color: var(--muted); font-size: 13px; margin-top: 24px; }
.note a { color: var(--accent); }
.kofi { display: block; padding: 15px; border-radius: 14px; text-decoration: none; font-weight: 700; margin: 10px 0;
  background: #ff5e5b; color: #fff; transition: transform .18s ease; }
.kofi:hover { transform: translateY(-2px); }
@media (prefers-reduced-motion: reduce) { .wrap, .icon { animation: none; } }
</style>
</head>
<body>
<div class="wrap">
  <img class="icon" id="art" src="/icon.png" alt="Hanten">
  <h1 id="title">Открыть мангу в Hanten</h1>
  <p class="sub" id="source"></p>
  <a class="btn primary" id="openApp" href="#">Открыть в приложении</a>
  <a class="btn secondary" id="openSource" href="#" style="display:none">Читать на сайте источника</a>
  <a class="btn secondary dl" id="dlApp" href="https://github.com/DezFix/Hanten/releases/latest">Скачать Hanten</a>
  <a class="kofi" id="kofiBtn" href="https://ko-fi.com/dezfix">☕ Поддержать на Ko-fi</a>
  <p class="note"><span id="notePre">Нет приложения? Поставьте APK с</span> <a href="https://github.com/DezFix/Hanten/releases/latest">GitHub</a> <span id="notePost">— ссылка откроется автоматически.</span></p>
</div>
<script>
(function () {
  var T = (window.HantenI18n ? HantenI18n.dict(HantenI18n.lang()) : {});
  var q = new URLSearchParams(location.search);
  var name = q.get("n") || q.get("name") || "";
  var source = q.get("s") || q.get("source") || "";
  var url = q.get("u") || q.get("url") || "";
  var publicUrl = q.get("p") || q.get("publicUrl") || "";
  var cover = q.get("c") || q.get("cover") || "";
  var MIRRORS = { COMX: "https://com-x.life" };
  document.getElementById("title").textContent = name || T["m.fallback"] || "Hanten";
  if (cover) {
    var art = document.getElementById("art");
    art.referrerPolicy = "no-referrer";
    art.onerror = function () {
      art.onerror = null;
      art.src = "/icon.png";
      art.className = "icon";
    };
    art.src = cover;
    art.className = "cover";
  }
  if (source) document.getElementById("source").textContent = (T["m.src"] || "Source:") + " " + source;
  document.getElementById("openApp").textContent = T["m.open"] || "Open";
  document.getElementById("openSource").textContent = T["m.source"] || "Source";
  document.getElementById("dlApp").textContent = T["m.dl"] || "Download";
  document.getElementById("notePre").textContent = T["m.noapp.pre"] || "";
  document.getElementById("notePost").textContent = T["m.noapp.post"] || "";
  var appLink = "hanten://manga/manga"
    + "?source=" + encodeURIComponent(source)
    + "&name=" + encodeURIComponent(name)
    + "&url=" + encodeURIComponent(url);
  document.getElementById("openApp").href = appLink;
  document.getElementById("kofiBtn").textContent = T["m.kofi"] || "Ko-fi";
  var sourceUrl = publicUrl || (MIRRORS[source] && url ? MIRRORS[source] + url : "");
  if (sourceUrl) {
    var src = document.getElementById("openSource");
    src.href = sourceUrl;
    src.style.display = "block";
  }
  // Пробуем сразу открыть приложение на Android
  if (/Android/i.test(navigator.userAgent) && (source || url)) {
    var f = document.createElement("iframe");
    f.style.display = "none";
    f.src = appLink;
    document.body.appendChild(f);
    setTimeout(function () { f.remove(); }, 2000);
  }
})();
</script>
</body>
</html>
