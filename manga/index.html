<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hanten — открыть мангу</title>
<style>
:root { color-scheme: dark; --bg: #141118; --card: #1f1a24; --accent: #b388ff; --text: #ece6f0; --muted: #a89fb3; }
* { box-sizing: border-box; }
body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
.wrap { max-width: 560px; margin: 0 auto; padding: 64px 20px; text-align: center; }
h1 { font-size: 22px; margin: 0 0 6px; }
.sub { color: var(--muted); font-size: 14px; margin: 0 0 28px; }
.btn { display: block; padding: 14px; border-radius: 12px; text-decoration: none; font-weight: 700; margin: 10px 0; }
.primary { background: var(--accent); color: #1a1025; }
.secondary { background: var(--card); color: var(--text); border: 1px solid #3a3340; font-weight: 400; }
.note { color: var(--muted); font-size: 13px; margin-top: 24px; }
.note a { color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <h1 id="title">Открыть мангу в Hanten</h1>
  <p class="sub" id="source"></p>
  <a class="btn primary" id="openApp" href="#">Открыть в приложении</a>
  <a class="btn secondary" id="openSource" href="#" style="display:none">Читать на сайте источника</a>
  <a class="btn secondary" href="https://github.com/DezFix/Hanten/releases/latest">Скачать Hanten</a>
  <p class="note">Нет приложения? Поставьте APK с <a href="https://github.com/DezFix/Hanten/releases/latest">GitHub</a> — ссылка откроется автоматически.</p>
</div>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var name = q.get("name") || "";
  var source = q.get("source") || "";
  var url = q.get("url") || "";
  var publicUrl = q.get("publicUrl") || "";
  if (name) document.getElementById("title").textContent = name;
  if (source) document.getElementById("source").textContent = "Источник: " + source;
  var appLink = "hanten://manga/manga"
    + "?source=" + encodeURIComponent(source)
    + "&name=" + encodeURIComponent(name)
    + "&url=" + encodeURIComponent(url);
  document.getElementById("openApp").href = appLink;
  if (publicUrl) {
    var src = document.getElementById("openSource");
    src.href = publicUrl;
    src.style.display = "block";
  }
  // Пробуем сразу открыть приложение на Android
  if (/Android/i.test(navigator.userAgent) && (source || url)) {
    var f = document.createElement("iframe");
    f.style.display = "none";
    f.src = appLink;
    document.body.appendChild(f);
    setTimeout(function () { f.remove(); }, 2000);
  }
})();
</script>
</body>
</html>
